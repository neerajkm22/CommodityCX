server:
  port: 8080
spring:
  application:
    name: commoditycx-trade-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commodities}
    username: ${DB_USER:commodities}
    password: ${DB_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
