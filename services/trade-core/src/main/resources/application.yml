server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: commoditycx-trade-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commodities}
    username: ${DB_USER:commodities}
    password: ${DB_PASSWORD:change-me-locally}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  jpa:
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
commoditycx:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-deploy-2026}
    token-ttl-minutes: ${JWT_TTL_MINUTES:10}
    oidc-issuer-uri: ${OIDC_ISSUER_URI:}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  events:
    enabled: ${EVENTS_ENABLED:false}
    topic: ${EVENTS_TOPIC:commoditycx.events}
    poll-ms: ${EVENTS_POLL_MS:1000}
  surveillance:
    poll-ms: ${SURVEILLANCE_POLL_MS:60000}
