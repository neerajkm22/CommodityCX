name: Security analysis
on:
  pull_request:
  push:
    branches: [main, feature/core-trading-workflows]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build Java for CodeQL extraction
        if: matrix.language == 'java-kotlin'
        run: mvn -B -f services/trade-core/pom.xml -DskipTests package
      - uses: github/codeql-action/analyze@v3
