name: CommodityCX CI
on:
  pull_request:
  push:
    branches: [main, feature/core-trading-workflows]
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test backend and PostgreSQL migrations
        run: mvn -B -f services/trade-core/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/trading-terminal/package.json
      - name: Install dependencies
        working-directory: frontend/trading-terminal
        run: npm install
      - name: Build Angular trading terminal
        working-directory: frontend/trading-terminal
        run: npm run build
